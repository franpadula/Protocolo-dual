<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo Dual: Sombras de Neo-Terrassa (P2P)</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PeerJS para conexión directa P2P sin base de datos -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <style>
        body { background-color: #050505; color: #00ff00; font-family: 'Courier New', Courier, monospace; }
        .cyber-input { background: #111; border: 1px solid #00ff00; color: #00ff00; padding: 0.5rem; outline: none; width: 100%; }
        .cyber-input:focus { box-shadow: 0 0 10px #00ff00; }
        .cyber-btn { background: #004400; border: 1px solid #00ff00; color: #00ff00; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .cyber-btn:hover:not(:disabled) { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; }
        .cyber-btn:disabled { border-color: #333; color: #555; background: #111; cursor: not-allowed; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 50; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div id="root" class="min-h-screen p-4 flex flex-col items-center justify-center relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [peerId, setPeerId] = useState("");
            const [targetId, setTargetId] = useState("");
            const [role, setRole] = useState(null); // 'host' (Agente) o 'client' (Analista)
            const [connected, setConnected] = useState(false);
            const [gameState, setGameState] = useState({ level: 1, agentData: "", analystData: "" });
            const [inputVal, setInputVal] = useState("");
            
            const peerRef = useRef(null);
            const connRef = useRef(null);

            // Inicializar Peer (Host)
            const createRoom = () => {
                const peer = new Peer();
                peer.on('open', (id) => {
                    setPeerId(id);
                    setRole('agente');
                });
                
                peer.on('connection', (conn) => {
                    connRef.current = conn;
                    setupConnection(conn);
                });
                peerRef.current = peer;
            };

            // Unirse a sala (Client)
            const joinRoom = () => {
                if (!targetId) return;
                const peer = new Peer();
                peer.on('open', () => {
                    setRole('analista');
                    const conn = peer.connect(targetId);
                    connRef.current = conn;
                    setupConnection(conn);
                });
                peerRef.current = peer;
            };

            const setupConnection = (conn) => {
                conn.on('open', () => {
                    setConnected(true);
                    // Sincronizar estado inicial al conectar
                    conn.send(gameState);
                });
                conn.on('data', (data) => {
                    setGameState(data);
                });
                conn.on('close', () => setConnected(false));
            };

            const updateState = (updates) => {
                const newState = { ...gameState, ...updates };
                setGameState(newState);
                if (connRef.current && connRef.current.open) {
                    connRef.current.send(newState);
                }
            };

            // --- LÓGICA DE NIVELES ---
            const checkLevel1 = () => {
                if (role === 'agente' && inputVal.trim() === "192.168.10.45") {
                    updateState({ level: 2 });
                    setInputVal("");
                }
            };

            const checkLevel2 = () => {
                if (role === 'analista' && inputVal.trim().toUpperCase() === "TRX-8821") {
                    updateState({ level: 3 });
                    setInputVal("");
                }
            };

            const activateSync = () => {
                if (role === 'agente') updateState({ agentData: "ready" });
                if (role === 'analista') updateState({ analystData: "ready" });
            };

            useEffect(() => {
                if (gameState.level === 3 && gameState.agentData === "ready" && gameState.analystData === "ready") {
                    updateState({ level: 4 });
                }
            }, [gameState]);


            // --- VISTAS ---
            if (!role) {
                return (
                    <div className="max-w-md w-full bg-black p-8 border border-green-500 shadow-[0_0_15px_#00ff00]">
                        <h1 className="text-2xl font-bold mb-6 text-center border-b border-green-800 pb-2">CONEXIÓN P2P</h1>
                        
                        <div className="mb-8 p-4 border border-gray-700 bg-gray-900">
                            <h3 className="mb-2 font-bold text-blue-400">JUGADOR 1 (Agente de Campo)</h3>
                            <button className="cyber-btn w-full text-sm" onClick={createRoom}>Crear Sesión Segura</button>
                        </div>

                        <div className="p-4 border border-gray-700 bg-gray-900">
                            <h3 className="mb-2 font-bold text-yellow-400">JUGADOR 2 (Analista SOC)</h3>
                            <input type="text" className="cyber-input mb-4" value={targetId} onChange={(e) => setTargetId(e.target.value)} placeholder="Introduce el ID del Agente..." />
                            <button className="cyber-btn w-full text-sm" onClick={joinRoom} disabled={!targetId}>Conectar a Sesión</button>
                        </div>
                    </div>
                );
            }

            if (role === 'agente' && !connected) {
                return (
                    <div className="max-w-md w-full bg-black p-8 border border-green-500 text-center">
                        <h2 className="text-xl mb-4 font-bold">SESIÓN CREADA</h2>
                        <p className="text-gray-400 mb-2">Envía este ID de conexión al Analista SOC:</p>
                        <div className="bg-gray-900 p-4 border border-green-500 mb-6 font-bold text-xl select-all">
                            {peerId || "Generando ID..."}
                        </div>
                        <p className="text-sm text-yellow-500 animate-pulse">Esperando conexión entrante...</p>
                    </div>
                );
            }

            if (role === 'analista' && !connected) {
                return <div className="max-w-md w-full bg-black p-8 border border-green-500 text-center animate-pulse">Estableciendo túnel P2P...</div>;
            }

            // PANTALLA PRINCIPAL DEL JUEGO
            return (
                <div className="max-w-2xl w-full bg-black p-8 border border-green-500 shadow-[0_0_20px_#004400]">
                    <div className="flex justify-between items-center mb-6 border-b border-green-800 pb-2 text-sm md:text-base">
                        <span className="font-bold text-green-500">ESTADO: CONECTADO</span>
                        <span className="font-bold text-blue-400">
                            ROL: {role === 'agente' ? 'OPERATIVO DE CAMPO' : 'ANALISTA SOC TIER 2'}
                        </span>
                    </div>

                    {gameState.level === 1 && (
                        <div>
                            <h2 className="text-xl mb-4 font-bold text-white">PROTOCOLO 1: BRECHA PERIMETRAL</h2>
                            {role === 'analista' ? (
                                <div className="bg-gray-900 p-4 border border-gray-700">
                                    <p className="text-red-400 mb-2">[ALERTA SIEM] - Elevación de privilegios detectada.</p>
                                    <p>Has aislado el origen de la anomalía en los logs de red.</p>
                                    <p className="font-bold mt-4 text-yellow-300">IP DE ORIGEN A BLOQUEAR: 192.168.10.45</p>
                                    <p className="mt-4 text-sm text-gray-400">Comunícate con el Agente de Campo para que introduzca esta IP en la terminal física.</p>
                                </div>
                            ) : (
                                <div className="bg-gray-900 p-4 border border-gray-700">
                                    <p>Estás frente a la terminal principal. El Analista tiene la IP maliciosa en su monitor.</p>
                                    <p className="mb-4">Pídele las coordenadas lógicas para aplicar el bloqueo.</p>
                                    <input type="text" className="cyber-input mb-4" value={inputVal} onChange={(e) => setInputVal(e.target.value)} placeholder="Introduce IPv4..." />
                                    <button className="cyber-btn w-full" onClick={checkLevel1}>Ejecutar Bloqueo Manual</button>
                                </div>
                            )}
                        </div>
                    )}

                    {gameState.level === 2 && (
                        <div>
                            <h2 className="text-xl mb-4 font-bold text-white">PROTOCOLO 2: INTERCEPTACIÓN DE HARDWARE</h2>
                            {role === 'agente' ? (
                                <div className="bg-gray-900 p-4 border border-gray-700">
                                    <p>Has encontrado un módulo de hardware sospechoso enganchado a un repetidor físico.</p>
                                    <p className="font-bold mt-4 text-yellow-300">NÚMERO DE SERIE GRABADO: TRX-8821</p>
                                    <p className="mt-4 text-sm text-gray-400">Transmite esta firma al Analista para que pueda afinar la regla en el SIEM.</p>
                                </div>
                            ) : (
                                <div className="bg-gray-900 p-4 border border-gray-700">
                                    <p>Necesitas afinar el caso de uso en el SIEM, pero te falta la firma física del dispositivo.</p>
                                    <p className="mb-4">El Agente de Campo ha localizado el módulo. Pregúntale el número de serie.</p>
                                    <input type="text" className="cyber-input mb-4" value={inputVal} onChange={(e) => setInputVal(e.target.value)} placeholder="Introduce N/S del hardware..." />
                                    <button className="cyber-btn w-full" onClick={checkLevel2}>Afinar Regla</button>
                                </div>
                            )}
                        </div>
                    )}

                    {gameState.level === 3 && (
                        <div>
                            <h2 className="text-xl mb-4 font-bold text-white">PROTOCOLO 3: PURGA DE SISTEMA DUAL</h2>
                            <div className="bg-gray-900 p-4 border border-gray-700 text-center">
                                <p className="mb-4">Para purgar el sistema, ambos operativos deben enviar la clave simultáneamente.</p>
                                <p className="text-sm text-gray-400 mb-6">Sincronicen sus relojes y pulsen el botón.</p>
                                
                                <button 
                                    className={`cyber-btn w-full py-4 text-xl ${((role === 'agente' && gameState.agentData === 'ready') || (role === 'analista' && gameState.analystData === 'ready')) ? 'bg-green-600 text-black border-green-600' : ''}`}
                                    onClick={activateSync}
                                >
                                    {((role === 'agente' && gameState.agentData === 'ready') || (role === 'analista' && gameState.analystData === 'ready')) ? 'AUTORIZACIÓN ENVIADA...' : 'AUTORIZAR PURGA'}
                                </button>

                                <div className="mt-6 flex justify-between px-2 md:px-8 text-sm font-bold">
                                    <span className={gameState.agentData === 'ready' ? 'text-green-500' : 'text-red-500'}>
                                        AGENTE: {gameState.agentData === 'ready' ? 'LISTO' : 'ESPERANDO'}
                                    </span>
                                    <span className={gameState.analystData === 'ready' ? 'text-green-500' : 'text-red-500'}>
                                        ANALISTA: {gameState.analystData === 'ready' ? 'LISTO' : 'ESPERANDO'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    )}

                    {gameState.level === 4 && (
                        <div className="text-center py-8">
                            <h2 className="text-3xl font-bold text-blue-400 mb-4 animate-pulse">AMENAZA NEUTRALIZADA</h2>
                            <p className="text-xl mb-2">Red asegurada.</p>
                            <button className="cyber-btn mt-8" onClick={() => updateState({ level: 1, agentData: "", analystData: "" })}>
                                Reiniciar Simulación
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
